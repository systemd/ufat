version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # libc is the only dependency. Stay on 0.2: 1.0 may drop the LFS64
      # functions ufat calls.
      - dependency-name: "libc"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
