# SPDX-License-Identifier: LGPL-2.1-or-later
#
# The build and the tests with the oldest and the newest rustc on x86_64
# and aarch64, the same with musl on x86_64, the case folding table, the
# lints for every supported architecture, the build and the tests on the
# other architectures, the exhaustive sweeps, a fuzzing run, the coverage
# report, a compile check of the Kani proofs, the dependency check, the
# performance comparison and the sign-offs. See HACKING.md.
#
# Warnings fail the build through CARGO_TARGET_<TRIPLE>_RUSTFLAGS and
# clippy's -D warnings.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, which catches a new stable rustc or runner image, with a
    # longer fuzzing run.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (${{ matrix.runner }}, rustc ${{ matrix.rust }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 has a varlinkctl with --push-fd.
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        rust: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dosfstools mtools

      - name: Install rustc ${{ matrix.rust }}
        env:
          RUST: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
          rustc --version
          host=$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${host}_RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

      - name: Check for the reference tools
        # The tests skip what they cannot find. Here they must not.
        run: |
          export PATH=$PATH:/usr/sbin:/sbin
          for tool in mkfs.fat fsck.fat mcopy mdir mmd mtype sha256sum mkfifo varlinkctl; do
            command -v "$tool" || { echo "::error::$tool is missing"; exit 1; }
          done
          varlinkctl --help | grep -- --push-fd >/dev/null || { echo "::error::varlinkctl has no --push-fd"; exit 1; }

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked

      - name: Build the release binary
        run: cargo build --release --locked

  musl:
    name: Build and test (x86_64-unknown-linux-musl, rustc ${{ matrix.rust }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.0', stable]
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dosfstools mtools

      - name: Install rustc ${{ matrix.rust }}
        env:
          RUST: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
          rustup target add "$TARGET"
          rustc --version
          t=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${t}_RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

      # rustc links a musl binary with the C library and the startup
      # files that come with the target, so no musl toolchain is needed.
      - name: Build
        run: cargo build --locked --target "$TARGET" --workspace --all-targets

      - name: Test
        run: cargo test --locked --target "$TARGET"

  fold-table:
    name: Case folding table
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the table from Unicode 16.0.0
        run: |
          ucd=$RUNNER_TEMP/ucd
          mkdir -p "$ucd"
          for f in UnicodeData.txt SpecialCasing.txt; do
            curl -sSfL --retry 3 -o "$ucd/$f" "https://www.unicode.org/Public/16.0.0/ucd/$f"
          done
          (cd "$ucd" && sha256sum -c "$GITHUB_WORKSPACE/tools/fold-table.sha256")
          cargo run --locked -q -p fold-table "$ucd" | diff -u src/name/fold_table.rs -

  clippy:
    name: clippy (rustc ${{ matrix.rust }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.0', stable]
    env:
      TARGETS: >-
        x86_64-unknown-linux-gnu
        i686-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        armv7-unknown-linux-gnueabihf
        loongarch64-unknown-linux-gnu
        powerpc-unknown-linux-gnu
        powerpc64-unknown-linux-gnu
        powerpc64le-unknown-linux-gnu
        riscv64gc-unknown-linux-gnu
        s390x-unknown-linux-gnu
        sparc64-unknown-linux-gnu
        x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustc ${{ matrix.rust }}
        env:
          RUST: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy
          rustup default "$RUST"
          # shellcheck disable=SC2086
          rustup target add $TARGETS
          rustc --version

      - name: clippy
        # The lints differ between architectures. Checking needs no cross
        # linker.
        run: |
          rc=0
          for t in $TARGETS; do
            echo "::group::$t"
            cargo clippy --locked --target "$t" --workspace --all-targets -- -D warnings ||
              { echo "::error::clippy failed for $t"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  fmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustc
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version

      - name: rustfmt
        run: |
          cargo fmt --all --check
          rustfmt --check --edition 2021 verify/lib.rs

  cross:
    name: Build and test (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # i686 runs on the x86_64 kernel with the i386 libraries of the
          # runner. The others run under qemu with the libraries of the
          # cross toolchain in /usr/<gcc>. binfmt_misc hands the ufat
          # binary the tests start to qemu as well, and QEMU_LD_PREFIX
          # tells qemu where the libraries are.
          - target: i686-unknown-linux-gnu
            gcc: i686-linux-gnu
            libc: i386
            qemu: ''
            runtime: libc6-i386 lib32gcc-s1
            experimental: false
          - target: armv7-unknown-linux-gnueabihf
            gcc: arm-linux-gnueabihf
            libc: armhf
            qemu: arm
            runtime: ''
            experimental: false
          - target: powerpc-unknown-linux-gnu
            gcc: powerpc-linux-gnu
            libc: powerpc
            qemu: ppc
            runtime: ''
            experimental: false
          - target: powerpc64-unknown-linux-gnu
            gcc: powerpc64-linux-gnu
            libc: ppc64
            qemu: ppc64
            runtime: ''
            experimental: false
          - target: powerpc64le-unknown-linux-gnu
            gcc: powerpc64le-linux-gnu
            libc: ppc64el
            qemu: ppc64le
            runtime: ''
            experimental: false
          - target: riscv64gc-unknown-linux-gnu
            gcc: riscv64-linux-gnu
            libc: riscv64
            qemu: riscv64
            runtime: ''
            experimental: false
          - target: s390x-unknown-linux-gnu
            gcc: s390x-linux-gnu
            libc: s390x
            qemu: s390x
            runtime: ''
            experimental: false
          - target: sparc64-unknown-linux-gnu
            gcc: sparc64-linux-gnu
            libc: sparc64
            qemu: sparc64
            runtime: ''
            experimental: true
          - target: loongarch64-unknown-linux-gnu
            gcc: loongarch64-linux-gnu
            libc: loong64
            qemu: loongarch64
            runtime: ''
            experimental: true
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        env:
          GCC: ${{ matrix.gcc }}
          LIBC: ${{ matrix.libc }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends \
            "gcc-$GCC" "libc6-dev-$LIBC-cross" "libc6-$LIBC-cross" $RUNTIME \
            qemu-user qemu-user-binfmt dosfstools mtools

      - name: Install rustc
        env:
          GCC: ${{ matrix.gcc }}
          QEMU: ${{ matrix.qemu }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          rustc --version
          t=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          {
            echo "CARGO_TARGET_${t}_LINKER=$GCC-gcc"
            echo "CARGO_TARGET_${t}_RUSTFLAGS=-D warnings"
            if [ -n "$QEMU" ]; then
              echo "CARGO_TARGET_${t}_RUNNER=qemu-$QEMU -L /usr/$GCC"
              echo "QEMU_LD_PREFIX=/usr/$GCC"
            fi
          } >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --target "$TARGET" --workspace --all-targets

      - name: Test
        env:
          QEMU: ${{ matrix.qemu }}
        run: |
          args=()
          if [ -n "$QEMU" ]; then
            # qemu-user does not pass O_EMPTYPATH and SO_PASSRIGHTS on to
            # the kernel, and it keeps the signal mask of a thread to
            # itself, so a signalfd never sees a blocked SIGTERM.
            args=(--skip o_emptypath --skip so_passrights --skip sigterm)
          fi
          cargo test --locked --target "$TARGET" -- "${args[@]}"

  slow:
    name: Exhaustive sweeps
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: cargo test --locked --test exhaustive -- --ignored

  fuzz:
    name: Fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dosfstools mtools

      - name: Build
        run: cargo build --locked -p ufat -p fuzz-seeds

      - name: Fuzz
        env:
          ITERATIONS: ${{ github.event_name == 'schedule' && '5000' || '200' }}
        run: tests/fuzz/run.sh

      - name: Upload the findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: target/fuzz/out/

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dosfstools mtools

      - name: Install rustc
        # llvm-tools matches the LLVM of rustc.
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable
          rustc --version

      - name: Report
        run: |
          tools/coverage.sh
          {
            echo '```'
            cat target/coverage/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage/report.txt

  kani:
    name: Kani proofs build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup

      - name: Build the proofs
        # Running them takes more time and memory than a runner has. This
        # only checks that every harness builds, the slow ones and the one
        # of the directory index included.
        env:
          SLOW: 1
          DIR: 1
          KANI_FLAGS: -Z stubbing -Z unstable-options --only-codegen
        run: verify/run.sh

  deps:
    name: Dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the crates from outside the tree
        # Cargo.lock lists every dependency of every package, for all
        # targets and features, the build and test dependencies included.
        # libc, lexopt, and sha2 with the crates it needs.
        env:
          EXPECTED: block-buffer cfg-if cpufeatures crypto-common digest hybrid-array lexopt libc sha2 typenum
        run: |
          deps=$(cargo metadata --locked --format-version 1 |
            jq -r '.workspace_members as $m | .packages[] | select(.id as $i | $m | index($i) | not) | .name' |
            LC_ALL=C sort -u | xargs)
          echo "$deps"
          [ "$deps" = "$EXPECTED" ] || { echo "::error::expected the crates $EXPECTED, found $deps"; exit 1; }

  signoff:
    name: Sign-off
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check that every commit is signed off
        # Every commit carries a Signed-off-by: line from its author: the
        # commits of a pull request, and those a push added. Merge commits
        # are left out, since GitHub's merge button writes them without a
        # sign-off. A sign-off counts when its address or its name is the
        # author's: an affiliation in parentheses changes the name, and
        # dependabot signs off with another address than it commits with.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case $EVENT in
          pull_request) range=HEAD^1..HEAD^2 ;;
          push)
            range=$BEFORE..HEAD
            # A new branch or a push that replaced the history: all of it.
            git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null || range=HEAD
            ;;
          *) exit 0 ;;
          esac
          # A range git can't list fails the step here.
          commits=$(git log --no-merges --format='%H %ae %an' "$range")
          bad=0
          while read -r commit email name; do
            [ -n "$commit" ] || continue
            ok=0
            while read -r signoff; do
              signoff_name=${signoff%% <*}
              signoff_email=${signoff##*<}
              signoff_email=${signoff_email%%>*}
              if [ "${signoff_email,,}" = "${email,,}" ] || [ "${signoff_name,,}" = "${name,,}" ]; then
                ok=1
              fi
            done < <(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")
            if [ "$ok" = 0 ]; then
              echo "::error::$(git log -1 --format='%h %s' "$commit"): no Signed-off-by: from $name <$email>"
              bad=1
            fi
          done <<< "$commits"
          exit "$bad"

  perf:
    name: Performance
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base, and the commits since, for their trailers.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind strace

      - name: Install rustc
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Pick the base
        # A pull request is checked out merged into main: the base is main,
        # the merge's first parent. A push is compared with main before it,
        # the weekly run with main a week earlier. When there is no such
        # commit, or the push replaced main's history, the base is the
        # commit before the last.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case $EVENT in
          pull_request) base=$(git rev-parse HEAD^1) ;;
          push) base=$BEFORE ;;
          *) base=$(git rev-list -n 1 --before='7 days ago' HEAD) ;;
          esac
          git merge-base --is-ancestor "${base:-none}" HEAD 2>/dev/null || base=$(git rev-parse HEAD^1)
          git log -1 --oneline "$base"
          echo "BASE=$base" >> "$GITHUB_ENV"
          # The workloads the Perf-regression: trailers since then accept.
          git log --format='%(trailers:key=Perf-regression,valueonly)' "$base..HEAD" |
            tee "$RUNNER_TEMP/accept"

      - name: Build the base and the head
        # Separate target directories: in a shared one cargo takes the
        # binary built from one tree as fresh for the other.
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && CARGO_TARGET_DIR=$RUNNER_TEMP/target-base cargo build --release --locked -p ufat)
          cargo build --release --locked -p ufat -p bench
          cp "$RUNNER_TEMP/target-base/release/ufat" "$RUNNER_TEMP/ufat-base"
          cp target/release/ufat "$RUNNER_TEMP/ufat-head"

      - name: Compare
        env:
          BENCH_DIR: /dev/shm/ufat-compare
        run: |
          if cmp -s "$RUNNER_TEMP/ufat-base" "$RUNNER_TEMP/ufat-head"; then
            echo "The base and the head build the same binary." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bench/compare.sh "$RUNNER_TEMP/ufat-base" "$RUNNER_TEMP/ufat-head"
          bench/compare.py --accept "$RUNNER_TEMP/accept" --summary "$GITHUB_STEP_SUMMARY" "$BENCH_DIR/out"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance
          path: /dev/shm/ufat-compare/out/
          if-no-files-found: ignore
