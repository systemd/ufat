# SPDX-License-Identifier: LGPL-2.1-or-later

[workspace]
members = [
    ".",
    "src/blkid",
    "src/cpio",
    "src/dlopen",
    "src/dlopen-note",
    "src/fat",
    "src/json",
    "src/shared",
    "src/uapi16",
    "src/varlink",
    "tools",
    "tests/crash",
    "tests/crash/cpio",
    "tests/crash/shared",
    "tests/fuzz",
    "bench",
]
# A plain `cargo build` or `cargo test` leaves out the case folding table
# generator, the fuzzing seeds and the benchmarks.
default-members = [
    ".",
    "src/blkid",
    "src/cpio",
    "src/dlopen",
    "src/dlopen-note",
    "src/fat",
    "src/json",
    "src/shared",
    "src/uapi16",
    "src/varlink",
    "tests/crash",
    "tests/crash/cpio",
]
# cargo update picks dependency versions that support rust-version.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
# ufat has to keep building with this rustc.
rust-version = "1.85"
license = "LGPL-2.1-or-later"
publish = false

[workspace.dependencies]
blkid = { path = "src/blkid" }
cpio = { path = "src/cpio" }
dlopen = { path = "src/dlopen" }
dlopen-note = { path = "src/dlopen-note" }
fat = { path = "src/fat" }
json = { path = "src/json" }
lexopt = "0.3.2"
# The _IO and _IOR helpers came with 0.2.172. Stay on 0.2: 1.0 may drop
# the LFS64 functions such as openat64 and fstatfs64.
libc = "0.2.191"
# 0.11.1 and later need rustc 1.88.
sha2 = { version = "0.11.0", default-features = false }
shared = { path = "src/shared" }
uapi16 = { path = "src/uapi16" }
varlink = { path = "src/varlink" }

[workspace.lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(ufat_trace)"] }

[package]
name = "ufat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fat.workspace = true
json.workspace = true
lexopt.workspace = true
libc.workspace = true
varlink.workspace = true

[dev-dependencies]
cpio.workspace = true

[lints]
workspace = true

# cargo build, cargo test, the fuzzing campaign and the exhaustive sweeps
# run optimized, with the overflow checks and debug assertions of the dev
# profile.
[profile.dev]
opt-level = 2
