# SPDX-License-Identifier: LGPL-2.1-or-later

[workspace]
members = [".", "json", "varlink", "tools", "tests/crash"]
# A plain `cargo build` or `cargo test` leaves out the case folding table
# generator.
default-members = [".", "json", "varlink", "tests/crash"]
# cargo update picks dependency versions that support rust-version.
resolver = "3"

[workspace.package]
edition = "2021"
# ufat has to keep building with this rustc.
rust-version = "1.85"
license = "LGPL-2.1-or-later"
publish = false

[workspace.dependencies]
json = { path = "json" }
lexopt = "0.3.2"
# The _IO and _IOR helpers came with 0.2.172. Stay on 0.2: 1.0 may drop
# the LFS64 functions such as openat64 and fstatfs64.
libc = "0.2.191"
# 0.11.1 and later need rustc 1.88.
sha2 = { version = "0.11.0", default-features = false }

[workspace.lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(ufat_trace)"] }

[package]
name = "ufat"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
json.workspace = true
lexopt.workspace = true
libc.workspace = true
sha2.workspace = true

[lints]
workspace = true

# cargo build, cargo test and the exhaustive sweeps run optimized, with
# the overflow checks and debug assertions of the dev profile.
[profile.dev]
opt-level = 2
