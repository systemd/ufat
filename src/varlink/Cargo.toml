[package]
name = "varlink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
libc.workspace = true
serde_core.workspace = true
# A service reads the floats of its parameters as they were written, and
# a reply keeps its members in the order they were given.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
