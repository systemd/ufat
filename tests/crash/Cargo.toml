[package]
name = "fat-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library again, on top of the shared crate with the write trace of
# device.rs compiled in, see shared/. Only the crash consistency harness
# uses it.
[lib]
path = "../../src/fat/lib.rs"
test = false
doctest = false
doc = false

[[test]]
name = "crash"
path = "crash.rs"

[dependencies]
blkid.workspace = true
json.workspace = true
shared = { package = "shared-trace", path = "shared" }
uapi16.workspace = true

[lints]
workspace = true
